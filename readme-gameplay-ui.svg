<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">WRDHOUND game indicators</title><desc id="desc">An illustrated game dashboard showing exit distance, hound gap, remaining moves, and the word chain.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2b2050" opacity=".14"/></pattern></defs>
<rect width="1200" height="360" rx="24" fill="#eee9f7"/><rect width="1200" height="360" rx="24" fill="url(#dots)"/>
<text x="42" y="52" fill="#1d1535" font-family="Arial,sans-serif" font-size="27" font-weight="900">READ THE BOARD. MANAGE THE RISK.</text>
<g transform="translate(42 82)"><rect width="1116" height="234" rx="20" fill="#fffdff" stroke="#2b2050" stroke-width="4"/>
<g transform="translate(24 22)"><text x="0" y="15" fill="#766c93" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">EXIT DISTANCE</text><text x="0" y="50" fill="#1d1535" font-family="Arial,sans-serif" font-size="30" font-weight="900">4 STEPS</text><rect x="0" y="65" width="260" height="14" rx="7" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/><rect x="2" y="67" width="172" height="10" rx="5" fill="#c6ef4e"/><text x="0" y="106" fill="#4a4068" font-family="Arial,sans-serif" font-size="13">How far the EXIT is from your word.</text></g>
<path d="M324 20V210" stroke="#c5bbdb" stroke-width="2"/>
<g transform="translate(358 22)"><text x="0" y="15" fill="#766c93" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">HOUND GAP</text><text x="0" y="50" fill="#e5484d" font-family="Arial,sans-serif" font-size="30" font-weight="900">2 STEPS</text><g transform="translate(0 65)"><rect width="32" height="14" rx="7" fill="#e5484d" stroke="#2b2050" stroke-width="2"/><rect x="39" width="32" height="14" rx="7" fill="#e5484d" stroke="#2b2050" stroke-width="2"/><rect x="78" width="32" height="14" rx="7" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/><rect x="117" width="32" height="14" rx="7" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/><rect x="156" width="32" height="14" rx="7" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/><rect x="195" width="32" height="14" rx="7" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/></g><text x="0" y="106" fill="#4a4068" font-family="Arial,sans-serif" font-size="13">Graph distance to the Hound. Low is danger.</text></g>
<path d="M624 20V210" stroke="#c5bbdb" stroke-width="2"/>
<g transform="translate(658 22)"><text x="0" y="15" fill="#766c93" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">MOVES LEFT</text><text x="0" y="50" fill="#1d1535" font-family="Arial,sans-serif" font-size="30" font-weight="900">6 / 9</text><rect x="0" y="65" width="220" height="14" rx="7" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/><rect x="2" y="67" width="146" height="10" rx="5" fill="#6a4fe0"/><text x="0" y="106" fill="#4a4068" font-family="Arial,sans-serif" font-size="13">Your remaining move budget.</text></g>
<path d="M900 20V210" stroke="#c5bbdb" stroke-width="2"/>
<g transform="translate(934 22)"><text x="0" y="15" fill="#766c93" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">WORD CHAIN</text><g transform="translate(0 30)" font-family="monospace" font-size="17" font-weight="900"><text x="0" y="20" fill="#6a4fe0">00  COLD</text><text x="0" y="48" fill="#6a4fe0">01  CORD</text><text x="0" y="76" fill="#6a4fe0">02  CARD</text><text x="0" y="104" fill="#2f8f5b">03  WARD  ✓</text></g></g>
</g>
<text x="600" y="344" fill="#766c93" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Illustrative values only. The live meters update after every move.</text>
</svg>