<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">How the Hound hunts</title><desc id="desc">A schematic showing the Hound moving one word edge closer to the player after each legal move, with danger patterns around its current word.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2b2050" opacity=".14"/></pattern></defs>
<rect width="1200" height="350" rx="24" fill="#eee9f7"/><rect width="1200" height="350" rx="24" fill="url(#dots)"/>
<text x="42" y="52" fill="#1d1535" font-family="Arial,sans-serif" font-size="27" font-weight="900">THE HOUND DOES NOT GUESS.</text>
<text x="44" y="80" fill="#766c93" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ITS NEXT STEP IS DETERMINISTIC</text>
<rect x="42" y="111" width="1116" height="195" rx="18" fill="#fffdff" stroke="#2b2050" stroke-width="3"/>
<g transform="translate(86 152)"><circle cx="52" cy="52" r="36" fill="#6a4fe0" stroke="#2b2050" stroke-width="4"/><text x="52" y="57" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="900">YOU</text><text x="52" y="111" fill="#4a4068" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800">RUNNER</text></g>
<path d="M198 204H360" stroke="#766c93" stroke-width="4" stroke-dasharray="8 8"/><path d="M350 193l12 11-12 11" fill="none" stroke="#766c93" stroke-width="4"/>
<g transform="translate(382 152)"><circle cx="52" cy="52" r="36" fill="#e5484d" stroke="#2b2050" stroke-width="4"/><text x="52" y="57" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="900">HOUND</text><text x="52" y="111" fill="#4a4068" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800">CURRENT</text></g>
<path d="M496 204H650" stroke="#e5484d" stroke-width="4"/><path d="M640 193l12 11-12 11" fill="none" stroke="#e5484d" stroke-width="4"/>
<g transform="translate(674 152)"><circle cx="52" cy="52" r="36" fill="#e5484d" stroke="#2b2050" stroke-width="4" opacity=".18"/><circle cx="52" cy="52" r="25" fill="#e5484d" stroke="#2b2050" stroke-width="3"/><text x="52" y="57" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="900">HOUND</text><text x="52" y="111" fill="#4a4068" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800">NEXT STEP</text></g>
<path d="M790 204H930" stroke="#766c93" stroke-width="4" stroke-dasharray="8 8"/><path d="M920 193l12 11-12 11" fill="none" stroke="#766c93" stroke-width="4"/>
<g transform="translate(950 144)"><rect width="165" height="120" rx="13" fill="#eee9f7" stroke="#2b2050" stroke-width="2"/><text x="82" y="25" fill="#766c93" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1">DANGER PATTERNS</text><g fill="#e5484d" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle"><text x="82" y="52">_ORD</text><text x="82" y="72">W_RD</text><text x="82" y="92">WO_D</text><text x="82" y="112">WOR_</text></g></g>
<text x="600" y="332" fill="#4a4068" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">After your move, it chooses the adjacent dictionary word that minimizes graph distance to you. Alphabetical order breaks ties.</text>
</svg>