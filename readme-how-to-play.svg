<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">How to play WRDHOUND</title><desc id="desc">A five word ladder showing COLD, CORD, CARD, WARD and WARM, changing one letter on each move.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2b2050" opacity=".14"/></pattern><filter id="s" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#2b2050"/></filter></defs>
<rect width="1200" height="330" rx="24" fill="#eee9f7"/><rect width="1200" height="330" rx="24" fill="url(#dots)"/>
<text x="42" y="55" fill="#1d1535" font-family="Arial,sans-serif" font-size="27" font-weight="900">ONE LETTER. ONE VALID WORD. ONE MOVE.</text>
<text x="44" y="82" fill="#766c93" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">EXAMPLE WORD LADDER</text>
<g transform="translate(48 119)" filter="url(#s)">
<g><rect width="180" height="108" rx="15" fill="#6a4fe0" stroke="#2b2050" stroke-width="4"/><text x="90" y="66" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="900" letter-spacing="4">COLD</text></g>
<g transform="translate(228 0)"><rect width="180" height="108" rx="15" fill="#6a4fe0" stroke="#2b2050" stroke-width="4"/><text x="90" y="66" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="900" letter-spacing="4">CORD</text><rect x="68" y="15" width="44" height="7" rx="3" fill="#c6ef4e"/></g>
<g transform="translate(456 0)"><rect width="180" height="108" rx="15" fill="#6a4fe0" stroke="#2b2050" stroke-width="4"/><text x="90" y="66" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="900" letter-spacing="4">CARD</text><rect x="68" y="15" width="44" height="7" rx="3" fill="#c6ef4e"/></g>
<g transform="translate(684 0)"><rect width="180" height="108" rx="15" fill="#6a4fe0" stroke="#2b2050" stroke-width="4"/><text x="90" y="66" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="900" letter-spacing="4">WARD</text><rect x="68" y="15" width="44" height="7" rx="3" fill="#c6ef4e"/></g>
<g transform="translate(912 0)"><rect width="180" height="108" rx="15" fill="#c6ef4e" stroke="#2b2050" stroke-width="4"/><text x="90" y="66" fill="#222f05" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="900" letter-spacing="4">WARM</text><path d="M76 83l10 10 20-23" fill="none" stroke="#222f05" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<g fill="#4a4068" font-family="Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle"><text x="138" y="258">START</text><text x="366" y="258">CHANGE L → R</text><text x="594" y="258">CHANGE O → A</text><text x="822" y="258">CHANGE C → W</text><text x="1050" y="258">CHANGE D → M</text></g>
<text x="600" y="302" fill="#766c93" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Every tile in the chain is a four letter dictionary word. No jumping, swapping or adding letters.</text>
</svg>